<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteVerse - High Contrast Accessible Quote Generator</title>
  <meta name="description" content="Discover inspiring quotes on life, love, courage, and strength with high-contrast accessibility design.">

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Soft Ambient Background Glow Blobs -->
  <div class="ambient-background" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Main Container -->
  <div class="app-container">

    <!-- Header Section -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" id="brand-icon">
          <!-- Sparkles Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"/>
            <path d="M5 3v4"/>
            <path d="M19 17v4"/>
            <path d="M3 5h4"/>
            <path d="M17 19h4"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>QuoteVerse</h1>
          <p>Daily Inspiration & Wisdom</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Favorites Counter Button -->
        <button id="favorites-toggle-btn" class="icon-btn" title="View Saved Favorites (F)" aria-label="View Saved Favorites (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
          <span class="btn-label-text">Favorites</span>
          <span class="badge" id="fav-count-badge">0</span>
        </button>
      </div>
    </header>

    <!-- Category Selector Navigation -->
    <nav class="category-nav" aria-label="Quote Category Selection">
      <div class="category-tabs" role="tablist">
        <button class="tab-btn active" data-category="all" role="tab" aria-selected="true">
          <span>✨ All</span>
        </button>
        <button class="tab-btn" data-category="life" role="tab" aria-selected="false">
          <span>🌱 Life</span>
        </button>
        <button class="tab-btn" data-category="love" role="tab" aria-selected="false">
          <span>❤️ Love</span>
        </button>
        <button class="tab-btn" data-category="courage" role="tab" aria-selected="false">
          <span>🔥 Courage</span>
        </button>
        <button class="tab-btn" data-category="strength" role="tab" aria-selected="false">
          <span>⚡ Strength</span>
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- Quote Card Component -->
      <article class="quote-card" id="quote-card" aria-live="polite">

        <!-- Decorative Watermark SVGs -->
        <svg class="quote-watermark quote-watermark-open" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 0 1-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179zm10 0C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 0 1-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179z"/>
        </svg>
        <svg class="quote-watermark quote-watermark-close" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 0 1-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179zm10 0C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 0 1-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179z"/>
        </svg>

        <!-- Card Top Header Meta -->
        <div class="quote-card-header">
          <span class="category-tag" id="quote-category-tag">Life</span>
          <div class="quote-meta-info">
            <span id="quote-length-badge">12 words</span>
          </div>
        </div>

        <!-- Quote Body & Text -->
        <div class="quote-body">
          <blockquote class="quote-text" id="quote-text">
            "Loading inspiration..."
          </blockquote>
          <cite class="quote-author" id="quote-author">
            Author Name
          </cite>
        </div>

        <!-- Quote Control Toolbar -->
        <div class="quote-controls">
          <div class="control-group-left">

            <!-- Copy Quote Button -->
            <button class="action-btn" id="copy-btn" title="Copy Quote (C)" aria-label="Copy Quote to Clipboard">
              <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              <svg id="check-icon" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span id="copy-btn-text">Copy Quote</span>
            </button>

            <!-- Speech Synthesis / Read Aloud Button -->
            <button class="action-btn" id="speak-btn" title="Read Aloud (S)" aria-label="Listen to Quote">
              <svg id="speak-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
              <span id="speak-btn-text">Listen</span>
            </button>

            <!-- Favorite Bookmark Button -->
            <button class="action-btn" id="favorite-btn" title="Save Favorite (F)" aria-label="Add to Favorites">
              <svg id="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              </svg>
              <span id="fav-btn-text">Save</span>
            </button>

            <!-- Share Button -->
            <button class="action-btn" id="share-btn" title="Share Quote" aria-label="Share Quote on Twitter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                <polyline points="16 6 12 2 8 6"/>
                <line x1="12" y1="2" x2="12" y2="15"/>
              </svg>
              <span>Share</span>
            </button>

          </div>

          <!-- Primary New Quote Button -->
          <button class="btn-primary" id="new-quote-btn" title="Generate New Quote (Space)">
            <svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 16h5v5"/>
            </svg>
            <span>New Quote</span>
          </button>
        </div>

      </article>

      <!-- Keyboard Accessibility Hint -->
      <div class="keyboard-hint" aria-label="Keyboard Shortcuts">
        <span>Shortcuts: <kbd class="kbd-key">Space</kbd> New Quote</span>
        <span>•</span>
        <span><kbd class="kbd-key">C</kbd> Copy</span>
        <span>•</span>
        <span><kbd class="kbd-key">F</kbd> Favorite</span>
        <span>•</span>
        <span><kbd class="kbd-key">S</kbd> Speak</span>
      </div>

    </main>

  </div>

  <!-- Favorites Modal Overlay -->
  <dialog id="favorites-modal" class="modal-overlay" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
          Saved Favorites
        </h2>
        <button id="close-modal-btn" class="icon-btn" aria-label="Close Favorites Modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modal-favorites-list">
        <!-- Rendered dynamically in app.js -->
      </div>
    </div>
  </dialog>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="assertive"></div>

  <!-- Scripts -->
  <script src="quotes.js"></script>
  <script src="app.js"></script>
</body>
</html>
